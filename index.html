<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discador Imobiliário — Metrocasa</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
<div id="app"></div>
<script>
const S="metrocasa.sessao",L="metrocasa.leads",U="metrocasa.usuarios",P="Metrocasa@2026";
const SL={sem_status:"Sem status",interessado:"Interessado",retorno:"Retorno",agendado:"Agendado",sem_interesse:"Sem interesse"};
const SO=["sem_status","interessado","retorno","agendado","sem_interesse"];
const LI=[
{id:"1",nome:"Carlos Eduardo",telefone:"11988887777",empreendimento:"Metrocasa Tatuapé",status:"sem_status"},
{id:"2",nome:"Ana Paula",telefone:"11977776666",empreendimento:"Metrocasa Brás",status:"interessado",observacao:"Gostou do apto."},
{id:"3",nome:"Ricardo Menezes",telefone:"11966665544",empreendimento:"Metrocasa Ipiranga",status:"retorno"}
];
const UI=[
{nome:"Vinicius",email:"vinicius@metrocasa.com.br",senha:P,role:"Corretor"},
{nome:"Admin Master",email:"admin@metrocasa.com.br",senha:P,role:"Admin"}
];
function ler(k,p){try{return JSON.parse(localStorage.getItem(k))??p}catch{return p}}
function gra(k,v){localStorage.setItem(k,JSON.stringify(v))}
function getLeads(){return ler(L,LI)}
function getUsrs(){return ler(U,UI)}
function getSessao(){return ler(S,null)}

let idx=0, emChamada=false;

function render(){
let s=getSessao();
let app=document.getElementById("app");
if(!s){app.innerHTML=loginHTML();return;}
app.innerHTML=`
<div class="flex flex-col lg:flex-row min-h-screen">
<aside class="w-full lg:w-64 bg-slate-900 border-r border-slate-800 p-5 flex flex-col justify-between">
<div>
<div class="flex items-center gap-3 pb-5 border-b border-slate-800">
<span class="w-10 h-10 bg-rose-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-rose-600/30"><i class="fa-solid.fa-headset"></i></span>
<div><p class="font-bold text-sm">${s.nome}</p><p class="text-xs text-rose-500 font-bold uppercase">Metrocasa</p></div>
</div>
<nav class="mt-4 space-y-1">
<button onclick="router('discador')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 text-slate-300"><i class="fa-solid.fa-phone w-4"></i> Discador</button>
<button onclick="router('leads')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 text-slate-300"><i class="fa-solid.fa-users w-4"></i> Leads</button>
<button onclick="router('importar')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 text-slate-300"><i class="fa-solid.fa-upload w-4"></i> Importar</button>
${s.admin?`<button onclick="router('admin')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 text-slate-300"><i class="fa-solid.fa-shield-halved w-4"></i> Painel Master</button>`:""}
</nav>
</div>
<button onclick="localStorage.removeItem('${S}');render();" class="mt-4 w-full flex items-center gap-3 px-4 py-3 rounded-xl border border-slate-800 text-sm font-medium text-slate-400 hover:text-rose-500 hover:border-rose-500"><i class="fa-solid.fa-right-from-bracket"></i> Sair</button>
</aside>
<main class="flex-1 max-w-4xl mx-auto p-6 w-full" id="main-content"></main>
</div>`;
router(window.currentRoute||"discador",true);
}

function router(r,keep){
window.currentRoute=r;
let el=document.getElementById("main-content");
if(!el)return;
if(r==="discador") el.innerHTML=discadorHTML();
if(r==="leads") el.innerHTML=leadsHTML();
if(r==="importar") el.innerHTML=importarHTML();
if(r==="admin") el.innerHTML=adminHTML();
}

function loginHTML(){
return `
<div class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
<div class="text-center mb-6">
<span class="mx-auto w-14 h-14 bg-rose-600 rounded-2xl flex items-center justify-center text-white text-xl shadow-lg shadow-rose-600/30 mb-3"><i class="fa-solid.fa-headset"></i></span>
<h1 class="text-xl font-bold">Discador Imobiliário</h1><p class="text-xs text-slate-400">Metrocasa Atendimento</p>
</div>
<form onsubmit="fazerLogin(event)" class="space-y-4">
<div><label class="text-[11px] font-semibold uppercase text-slate-400">E-mail ou Nome</label><input id="l-user" class="mt-1 w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-rose-600" placeholder="ex: vinicius"></div>
<div><label class="text-[11px] font-semibold uppercase text-slate-400">Senha (Padrão: ${P})</label><input id="l-pass" type="password" class="mt-1 w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm outline-none focus:border-rose-600" placeholder="••••••••"></div>
<button type="submit" class="w-full bg-rose-600 text-white py-3 rounded-xl text-xs font-semibold uppercase tracking-wider shadow-lg shadow-rose-600/25 hover:bg-rose-500">Acessar Sistema</button>
<button type="button" onclick="entrarAdmin()" class="w-full text-center text-xs text-slate-400 underline hover:text-white pt-2">Entrar como Administrador Geral</button>
</form>
</div></div>`;
}

function fazerLogin(e){
e.preventDefault();
let u=document.getElementById("l-user").value.trim().toLowerCase();
let p=document.getElementById("l-pass").value;
let user=getUsrs().find(x=>x.email.toLowerCase()===u||x.nome.toLowerCase()===u);
if(user&&user.senha===p){gra(S,{nome:user.nome,email:user.email,admin:user.role==="Admin"});render();}
else alert("Credenciais inválidas!");
}

function entrarAdmin(){
let a=getUsrs().find(x=>x.role==="Admin");
gra(S,{nome:a.nome,email:a.email,admin:true});
render();
}

function discadorHTML(){
let leads=getLeads();
let l=leads[idx];
let total=leads.length;
let trab=leads.filter(x=>x.status!=="sem_status").length;
let int=leads.filter(x=>x.status==="interessado"||x.status==="agendado").length;
let prog=total?Math.round((idx/total)*100):0;
return `
<h1 class="text-xl font-bold">Discador</h1>
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-4">
<div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl"><p class="text-[11px] text-slate-400 uppercase font-semibold">Leads</p><p class="text-2xl font-bold mt-1">${total}</p></div>
<div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl"><p class="text-[11px] text-slate-400 uppercase font-semibold">Trabalhados</p><p class="text-2xl font-bold mt-1">${trab}</p></div>
<div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl"><p class="text-[11px] text-slate-400 uppercase font-semibold">Interesses</p><p class="text-2xl font-bold mt-1">${int}</p></div>
<div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl"><p class="text-[11px] text-slate-400 uppercase font-semibold">Conversão</p><p class="text-2xl font-bold mt-1">${total?Math.round((int/total)*100):0}%</p></div>
</div>
<div class="mt-5"><div class="flex justify-between text-xs text-slate-400"><span>Lead ${total?idx+1:0} de ${total}</span><span>${prog}%</span></div>
<div class="w-full bg-slate-900 h-2 rounded-full mt-2 overflow-hidden"><div class="bg-rose-600 h-full transition-all" style="width:${prog}%"></div></div></div>
${l?`
<div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl mt-6 text-center">
<p class="text-xs uppercase text-slate-400">${l.empreendimento}</p>
<h2 class="text-3xl font-bold mt-2">${l.nome}</h2>
<p class="text-lg text-slate-400 mt-1">${l.telefone}</p>
<div class="flex justify-center gap-3 mt-6">
<a href="tel:${l.telefone}" class="bg-rose-600 text-white px-6 py-3 rounded-xl text-sm font-semibold hover:bg-rose-500"><i class="fa-solid.fa-phone mr-2"></i> Ligar</a>
<a href="https://wa.me/55${l.telefone.replace(/\D/g,'')}" target="_blank" class="border border-slate-800 px-6 py-3 rounded-xl text-sm font-semibold text-emerald-500 hover:border-emerald-500"><i class="fa-brands.fa-whatsapp mr-2"></i> WhatsApp</a>
</div>
<div class="grid sm:grid-cols-2 gap-4 mt-6 text-left">
<div><label class="text-[11px] uppercase text-slate-400 font-semibold">Status</label><select id="lead-status" onchange="atualizarLead('status',this.value)" class="mt-1 w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-sm outline-none">${SO.map(s=>`<option value="${s}" ${l.status===s?'selected':''}>${SL[s]}</option>`).join('')}</select></div>
<div><label class="text-[11px] uppercase text-slate-400 font-semibold">Observação</label><textarea id="lead-obs" oninput="atualizarLead('observacao',this.value)" class="mt-1 w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-sm outline-none" rows="2">${l.observacao||''}</textarea></div>
</div>
<button onclick="proximoLead()" class="mt-6 bg-slate-800 hover:bg-slate-700 text-white px-6 py-2.5 rounded-xl text-sm font-semibold w-full">Salvar e Próximo <i class="fa-solid.fa-arrow-right ml-2"></i></button>
</div>`:`<p class="text-slate-400 mt-6">Nenhum lead disponível.</p>`}`;
}

function atualizarLead(campo, val){
let leads=getLeads();
leads[idx][campo]=val;
gra(L,leads);
}

function proximoLead(){
let leads=getLeads();
if(leads.length) idx=(idx+1)%leads.length;
router('discador');
}

function leadsHTML(){
let leads=getLeads();
return `
<h1 class="text-xl font-bold">Lista de Leads</h1>
<div class="mt-6 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
<table class="w-full text-left text-sm">
<thead class="bg-slate-950 text-xs uppercase text-slate-400"><tr><th class="p-4">Nome</th><th class="p-4">Telefone</th><th class="p-4">Empreendimento</th><th class="p-4">Status</th></tr></thead>
<tbody>
${leads.map(l=>`<tr class="border-t border-slate-800"><td class="p-4 font-medium">${l.nome}</td><td class="p-4 text-slate-400">${l.telefone}</td><td class="p-4 text-slate-400">${l.empreendimento}</td><td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs bg-slate-800 text-slate-300">${SL[l.status]}</span></td></tr>`).join('')}
</tbody>
</table>
</div>`;
}

function importarHTML(){
return `
<h1 class="text-xl font-bold">Importar Leads</h1>
<div class="mt-6 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
<label class="text-xs uppercase text-slate-400 font-semibold">Cole sua lista (Nome, Telefone, Empreendimento)</label>
<textarea id="imp-txt" rows="5" class="mt-2 w-full bg-slate-950 border border-slate-800 p-4 rounded-xl text-sm outline-none" placeholder="João Silva, 11999998888, Metrocasa Tatuapé"></textarea>
<button onclick="execImportar()" class="mt-4 bg-rose-600 text-white px-6 py-2.5 rounded-xl text-xs font-semibold uppercase hover:bg-rose-500">Processar</button>
</div>`;
}

function execImportar(){
let txt=document.getElementById("imp-txt").value;
let linhas=txt.split("\n");
let leads=getLeads();
linhas.forEach((l,i)=>{
let p=l.split(/[,;|]/);
if(p.length>=2) leads.push({id:Date.now()+i,nome:p[0].trim(),telefone:p[1].replace(/\D/g,'').trim(),empreendimento:p[2]?.trim()||"Metrocasa Geral",status:"sem_status"});
});
gra(L,leads);
alert("Leads importados com sucesso!");
router('leads');
}

function adminHTML(){
let usrs=getUsrs();
return `
<h1 class="text-xl font-bold">Painel Master</h1>
<div class="mt-6 bg-slate-900 border border-slate-800 p-6 rounded-2xl">
<h2 class="text-sm font-bold mb-3">Equipe Cadastrada</h2>
<div class="space-y-2">
${usrs.map(u=>`<div class="flex justify-between items-center p-3 bg-slate-950 rounded-xl border border-slate-800"><div><p class="font-medium text-sm">${u.nome}</p><p class="text-xs text-slate-400">${u.email}</p></div><button onclick="resetPass('${u.email}')" class="text-xs border border-slate-800 px-3 py-1.5 rounded-lg hover:border-rose-600">Resetar Senha</button></div>`).join('')}
</div>
</div>`;
}

function resetPass(email){
let usrs=getUsrs();
usrs=usrs.map(u=>u.email===email?{...u,senha:P}:u);
gra(U,usrs);
alert(`Senha redefinida para o padrão: ${P}`);
}

render();
</script>
</body>
</html>
